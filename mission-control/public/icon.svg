<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ADE Mission Control">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#11284A"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- radar rings -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#29B5E8" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#29B5E8" stroke-opacity="0.55" stroke-width="1.5"/>
  <!-- sweep -->
  <path d="M32 32 L32 11 A21 21 0 0 1 50.2 21.5 Z" fill="#29B5E8" fill-opacity="0.22"/>
  <line x1="32" y1="32" x2="50.2" y2="21.5" stroke="#29B5E8" stroke-width="2" stroke-linecap="round"/>
  <!-- three agents -->
  <circle cx="20" cy="40" r="3.6" fill="#7DD3FC"/>
  <circle cx="32" cy="46" r="3.6" fill="#A78BFA"/>
  <circle cx="44" cy="40" r="3.6" fill="#34D399"/>
  <path d="M23.4 41.6 L28.6 44.4 M35.4 44.4 L40.6 41.6" stroke="#CBD5E1" stroke-opacity="0.7" stroke-width="1.6" stroke-linecap="round"/>
  <!-- detected failure -->
  <circle cx="46" cy="23" r="3" fill="#F87171"/>
  <circle cx="32" cy="32" r="2.4" fill="#E2E8F0"/>
</svg>
